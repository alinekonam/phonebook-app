name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.example.phonebook",
            "appName": "دفترچه تلفن",
            "webDir": "www"
          }
          JSON
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk phonebook.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: دفترچه تلفن (نسخه ${{ github.run_number }})
          files: phonebook.apk
